name: Binance Square Auto Post

on:
  workflow_dispatch: {} # manual trigger button in the Actions tab
  schedule:
    - cron: "17 */6 * * *" # every 6h at :17 (00:17/06:17/12:17/18:17 UTC = 07:17/13:17/19:17/01:17 WIB); off the :00 peak, when GitHub delays or drops scheduled runs

permissions:
  contents: write # needed to commit data/posts.json back to the repo

# Prevents a manual workflow_dispatch from racing a scheduled cron run (or
# two overlapping runs from any cause). Without this, two concurrent runs
# can both read data/posts.json, both publish, then race to write/push it
# back — the loser's push either gets rejected or silently drops the other
# run's post from history. cancel-in-progress: false queues the second run
# instead of killing it, since we want both posts to happen, just not at
# the same time.
concurrency:
  group: square-autoposter
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung request must not hold the runner for the 6h default
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Generate and publish post
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_CONTEXT: ${{ vars.NEWS_CONTEXT }} # optional: "on" adds headline context to some themes
          BSTOCKS_EXTRA: ${{ vars.BSTOCKS_EXTRA }} # optional, e.g. AAPLBUSDT=Apple,MSFTBUSDT=Microsoft
        run: node src/run.mjs

      - name: Commit updated post history
        if: always() # run even if the publish step failed/skipped, in case
                      # data/posts.json changed before the failure point
        run: |
          git config user.name "square-autoposter-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/posts.json ]; then
            git add data/posts.json
            git diff --staged --quiet || git commit -m "chore: update post history [skip ci]"
            # A human push during the run would make a plain push non-fast-forward
            # AFTER the post is already live, so rebase and retry.
            for attempt in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
                exit 0
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep $((attempt * 5))
            done
            echo "::error::Could not push data/posts.json after 3 attempts"
            exit 1
          else
            echo "data/posts.json doesn't exist yet (no successful publish this run) — nothing to commit."
          fi

      # Optional failure alert. Does nothing unless BOTH Telegram secrets are
      # set, so forks and clones without them are unaffected. The message holds
      # only the repo name and a link to the run: no secrets, no post content.
      - name: Notify on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping alert."
            exit 0
          fi
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Square autoposter FAILED in ${REPO}. Run: ${RUN_URL}" \
            > /dev/null || echo "Alert could not be sent (ignored)."
